    computeStats().forEach(function(p){ statsById[p.id] = p; });

    var html = '<div class="stack">';
    html += '<div class="panel panel-pad"><div class="section-title">Sign-up &mdash; '+ 'Week '+meta.signup.weekNumber+'</div>';
    html += '<div style="font-size:12.5px;color:var(--ink-soft);margin-bottom:8px;">First 24 to sign up play. Extra names land on the waitlist and move up automatically if someone drops.</div>';
    html += '<div class="stat-hero"><div class="cell"><div class="v">'+confirmedIds.length+'/24</div><div class="l">Confirmed</div></div><div class="cell"><div class="v">'+waitlistIds.length+'</div><div class="l">Waitlist</div></div></div>';
    html += '<div class="actions" style="margin-top:12px;">';
    if(App.confirmStartWeek){
      html += '<span style="font-size:12px;color:var(--bench);align-self:center;">Lock in these '+confirmedIds.length+' players and generate courts?</span>';
      html += '<button class="btn ghost small" id="btnStartWeekNo">Cancel</button>';
      html += '<button class="btn accent small" id="btnStartWeekYes">Yes, start week '+meta.signup.weekNumber+'</button>';
    } else {
      html += '<button class="btn accent" id="btnStartWeek" '+(confirmedIds.length===0?'disabled':'')+'>Start week '+meta.signup.weekNumber+'</button>';
      if(confirmedIds.length===0) html += '<span style="font-size:11.5px;color:var(--ink-faint);align-self:center;">Sign up at least one player below first.</span>';
    }
    html += '</div>';
    html += '</div>';

    html += '<div class="panel"><div class="section-title" style="padding:14px 16px 0;">Full roster &middot; current standings order</div>';
    html += '<div style="font-size:12px;color:var(--ink-soft);padding:0 16px 10px;">Court '+(1)+' will get ranks 1&ndash;4, Court 2 ranks 5&ndash;8, and so on, straight off the season Standings (Court Points &rarr; W/L &rarr; point diff).</div>';
    rankOrder.forEach(function(id, idx){
      var entry = entries.find(function(e){ return e.id===id; });
      var isConfirmed = confirmedIds.indexOf(id)>-1;
      var isWaitlist = waitlistIds.indexOf(id)>-1;
      var tiedUp = idx>0 && statsTied(statsById[id], statsById[rankOrder[idx-1]]);
      var tiedDown = idx<rankOrder.length-1 && statsTied(statsById[id], statsById[rankOrder[idx+1]]);
      html += '<div class="roster-row">';
      html += '<span class="rank-pill">'+(idx+1)+'</span>';
      html += '<span class="name">'+nameOf(id)+'<span class="g">'+genderOf(id)+'</span></span>';
      if(isConfirmed) html += '<span class="pill confirmed">In &middot; #'+(confirmedIds.indexOf(id)+1)+'</span>';
      else if(isWaitlist) html += '<span class="pill waitlist">Wait &middot; #'+(waitlistIds.indexOf(id)+1)+'</span>';
      html += '<div class="rowbtns">';
      html += '<button class="iconbtn" data-rank-up="'+id+'" data-neighbor="'+(tiedUp?rankOrder[idx-1]:'')+'" title="'+(tiedUp?'Move up (tied on stats)':'Only movable when tied on stats')+'" '+(tiedUp?'':'disabled')+'>&uarr;</button>';
      html += '<button class="iconbtn" data-rank-down="'+id+'" data-neighbor="'+(tiedDown?rankOrder[idx+1]:'')+'" title="'+(tiedDown?'Move down (tied on stats)':'Only movable when tied on stats')+'" '+(tiedDown?'':'disabled')+'>&darr;</button>';
      if(entry && App.confirmDropout===id){
        html += '<button class="iconbtn" data-dropout-cancel title="Cancel">&#8617;</button>';
        html += '<button class="iconbtn" style="background:var(--bench-soft);color:var(--bench);border-color:var(--bench);" data-dropout="'+id+'" title="Confirm remove">Sure?</button>';
      } else if(entry){
        html += '<button class="iconbtn" data-dropout="'+id+'" title="Remove from signup">&times;</button>';
      } else {
        html += '<button class="iconbtn" data-signup="'+id+'" title="Sign up">+</button>';
      }
      html += '</div></div>';
    });
    html += '</div></div>';
    byId("app").innerHTML = html;

    document.querySelectorAll("[data-signup]").forEach(function(b){
      b.addEventListener("click", function(){
        var id = this.dataset.signup;
        var newEntries = entries.concat([{id:id, ts:Date.now()}]);
        App.db.doc("meta/state").update({signup: Object.assign({}, meta.signup, {entries:newEntries})});
      });
    });
    document.querySelectorAll("[data-dropout]").forEach(function(b){
      b.addEventListener("click", function(){
        var id = this.dataset.dropout;
        if(App.confirmDropout !== id){ App.confirmDropout = id; render(); return; }
        var newEntries = entries.filter(function(e){ return e.id!==id; });
        App.confirmDropout = null;
        App.db.doc("meta/state").update({signup: Object.assign({}, meta.signup, {entries:newEntries})});
      });
    });
    document.querySelectorAll("[data-dropout-cancel]").forEach(function(b){
      b.addEventListener("click", function(){ App.confirmDropout = null; render(); });
    });
    document.querySelectorAll("[data-rank-up]").forEach(function(b){
      b.addEventListener("click", function(){
        if(this.disabled || !this.dataset.neighbor) return;
        moveRank(this.dataset.rankUp, this.dataset.neighbor);
      });
    });
    document.querySelectorAll("[data-rank-down]").forEach(function(b){
      b.addEventListener("click", function(){
        if(this.disabled || !this.dataset.neighbor) return;
        moveRank(this.dataset.rankDown, this.dataset.neighbor);
      });
    });
    var startBtn = byId("btnStartWeek");
    if(startBtn) startBtn.addEventListener("click", function(){ App.confirmStartWeek = true; render(); });
    var startNo = byId("btnStartWeekNo");
    if(startNo) startNo.addEventListener("click", function(){ App.confirmStartWeek = false; render(); });
    var startYes = byId("btnStartWeekYes");
    if(startYes) startYes.addEventListener("click", function(){
      startYes.disabled = true;
      startNewWeek(confirmedIds, meta.signup.weekNumber).then(function(){
        App.confirmStartWeek = false;
      }).catch(function(){ startYes.disabled = false; });
    });
  }

  // Swaps two players' positions in the tiebreak-order list (App.meta.rankOrder).
  // This list only ever decides ranking among players fully tied on Standings
  // stats, so the swap targets the specific neighbor shown in the roster UI
  // rather than whatever happens to sit next to `id` in the raw stored list.
  function moveRank(id, neighborId){
    var order = (App.meta.rankOrder||INITIAL_RANK).slice();
    if(order.indexOf(id)===-1) order.push(id);
    if(order.indexOf(neighborId)===-1) order.push(neighborId);
    var i = order.indexOf(id), j = order.indexOf(neighborId);
    var t = order[i]; order[i]=order[j]; order[j]=t;
    App.db.doc("meta/state").update({rankOrder:order});
  }

  function startNewWeek(confirmedIds, weekNumber){
    var ordered = standingsOrder().filter(function(id){ return confirmedIds.indexOf(id)>-1; });
    var fullCourts = Math.min(6, Math.floor(ordered.length/4));
    var courts = {};
    for(var c=1;c<=fullCourts;c++){
      var group = ordered.slice((c-1)*4, c*4);
      var pr = seedGroupOf4(group);
      courts[c] = {teamA:pr.teamA, teamB:pr.teamB, scoreA:null, scoreB:null};
    }
    var bench = ordered.slice(fullCourts*4);
    var id = "week-"+weekNumber;
    return App.db.doc(weekDocPath(id)).set({
      number:weekNumber, label:"Week "+weekNumber,
      confirmed:confirmedIds, finalized:false, finalSeeding:null, finalCourtCount:null,
      rounds:[{index:0, courts:courts, benchSnapshot:bench, benchQueueBefore:[]}],
      benchQueue:bench
    }).then(function(){
      return App.db.doc("meta/state").update({
        activeWeekId:id,
        nextWeekNumber:weekNumber+1,
        signup:{weekNumber:weekNumber+1, entries:[]}
      });
    });
  }

  // Same frozen-snapshot-safe pattern as Live Round's courtView/mergedCourts,
  // but scoped to App.histDraft so editing history never collides with a
  // score being entered live for the current week.
  function histCourtView(round, c){
    var base = round.courts[c];
    var d = App.histDraft[c];
    return {
      teamA: base.teamA,
      teamB: base.teamB,
      scoreA: (d && d.scoreA!==undefined) ? d.scoreA : base.scoreA,
      scoreB: (d && d.scoreB!==undefined) ? d.scoreB : base.scoreB
    };
  }
  function histMergedCourts(round){
    var m = {};
    var n = courtCount(round);
    for(var c=1;c<=n;c++){ m[c] = histCourtView(round,c); }
    return m;
  }
  function histMissing(round){
    var m = histMergedCourts(round);
    var n = courtCount(round);
    var missing = [];
    for(var c=1;c<=n;c++){
      if(m[c].scoreA==null || m[c].scoreB==null) missing.push(c+" (needs both scores)");
      else if(m[c].scoreA===m[c].scoreB) missing.push(c+" (scores can't tie)");
    }
    return missing;
  }
  function saveHistoryRound(wk, round){
    var courts = histMergedCourts(round);
    var rounds = wk.rounds.map(function(r){
      return r.index===round.index
        ? {index:r.index, courts:courts, benchSnapshot:r.benchSnapshot, benchQueueBefore:r.benchQueueBefore}
        : r;
    });
    return App.db.doc(weekDocPath(wk.id)).update({rounds:rounds});
  }

  function renderHistory(){
    var html = '<div class="stack">';
    if(App.weekHistory.length===0){ html += '<div class="panel panel-pad empty">No completed weeks yet.</div>'; }
    App.weekHistory.forEach(function(wk){
      var open = App.historyOpen === wk.id;
      html += '<div class="panel week-card" data-week="'+wk.id+'">';
      var lastRound = wk.rounds && wk.rounds[wk.rounds.length-1];
      var lastN = lastRound ? courtCount(lastRound) : 0;
      var wasBench = (wk.benchQueue||[]).length>0;
      html += '<div class="week-card-head" data-week-toggle="'+wk.id+'"><div><div class="display" style="font-size:18px;color:var(--court);">'+wk.label+'</div><div class="meta" style="font-size:11px;color:var(--ink-faint);text-transform:uppercase;">'+(wasBench?"Bench mode":lastN+" court"+(lastN===1?'':'s'))+' &middot; '+(wk.rounds?wk.rounds.length:0)+' rounds'+(wk.finalized?' &middot; Finalized':' &middot; In progress')+'</div></div><div style="display:flex;align-items:center;gap:10px;">'+(wk.finalized?'<button class="btn ghost small" data-view-recap="'+wk.id+'">&#127881; Recap</button>':'')+'<span class="mono" style="color:var(--ink-faint);font-size:18px;">'+(open?'&minus;':'&plus;')+'</span></div></div>';

      if(open){
        (wk.rounds||[]).forEach(function(round){
          var editing = App.historyOpen===wk.id && App.histEditRound===round.index;
          html += '<div style="border-top:1px solid var(--line);padding:12px 16px;">';
          html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">';
          html += '<div class="section-title" style="margin:0;">Round '+(round.index+1)+'</div>';
          if(!editing) html += '<button class="btn ghost small" data-edit-round="'+round.index+'">Edit scores</button>';
          html += '</div>';

          var roundN = courtCount(round);
          for(var c=1;c<=roundN;c++){
            var court = editing ? histCourtView(round,c) : round.courts[c];
            var wl = winnerLoser(court);
            html += '<div style="display:grid;grid-template-columns:20px 1fr auto 1fr;align-items:center;gap:8px;padding:5px 0;'+(c<roundN?'border-bottom:1px dashed var(--line);':'')+'">';
            html += '<span class="mono" style="color:var(--ink-faint);font-size:11px;">'+c+'</span>';
            ["teamA","teamB"].forEach(function(key, idx){
              var team = court[key];
              var isWinner = wl && wl.winner===team;
              html += '<div style="font-size:13px;'+(idx===1?'text-align:right;':'')+(isWinner?'color:var(--win);font-weight:700;':'color:var(--ink-soft);')+'">'+team.filter(Boolean).map(nameOf).join(' & ')+'</div>';
              if(idx===0){
                if(editing){
                  html += '<div class="mono" style="display:flex;gap:4px;align-items:center;justify-content:center;">'
                    + '<input class="score-input" style="width:44px;padding:6px 2px;" type="number" min="0" inputmode="numeric" data-hcourt="'+c+'" data-hside="teamA" value="'+(court.scoreA==null?'':court.scoreA)+'">'
                    + '<span>&ndash;</span>'
                    + '<input class="score-input" style="width:44px;padding:6px 2px;" type="number" min="0" inputmode="numeric" data-hcourt="'+c+'" data-hside="teamB" value="'+(court.scoreB==null?'':court.scoreB)+'">'
                    + '</div>';
                } else {
                  html += '<div class="mono" style="text-align:center;font-size:13px;">'+(court.scoreA==null?'&mdash;':court.scoreA)+' &ndash; '+(court.scoreB==null?'&mdash;':court.scoreB)+'</div>';
                }
              }
            });
            html += '</div>';
          }

          if(editing){
            var missing = histMissing(round);
            html += '<div class="score-warn" style="text-align:right;margin-top:8px;color:'+(missing.length?'var(--bench)':'var(--win)')+';">'+(missing.length? 'Needed &mdash; Court '+missing.join(', Court ') : 'All '+roundN+' court'+(roundN===1?'':'s')+' valid.')+'</div>';
            html += '<div class="actions" style="margin-top:8px;"><button class="btn ghost small" data-cancel-round="'+round.index+'">Cancel</button><button class="btn accent small" data-save-round="'+round.index+'" '+(missing.length?'disabled':'')+'>Save changes</button></div>';
          }
          html += '</div>';
        });

        if(wk.finalSeeding){
          html += '<div style="border-top:1px solid var(--line);padding:12px 16px;">';
          html += '<div class="section-title">Final court order</div>';
          html += '<div class="week-seed">';
          var courtsAtFinal = wk.finalCourtCount || Math.min(6, Math.floor(wk.finalSeeding.length/4));
          for(var fc=1;fc<=courtsAtFinal;fc++){
            var g = wk.finalSeeding.slice((fc-1)*4,fc*4).filter(Boolean);
            if(g.length===0) continue;
            html += '<div class="c"><b>Court '+fc+'</b>'+g.map(nameOf).join(", ")+'</div>';
          }
          var benchAtFinal = wk.finalSeeding.slice(courtsAtFinal*4);
          if(benchAtFinal.length){
            html += '<div class="c"><b>Bench</b>'+benchAtFinal.map(nameOf).join(", ")+'</div>';
          }
          html += '</div></div>';
        }
      }
      html += '</div>';
    });
    html += '</div>';
    byId("app").innerHTML = html;
    wireHistory();
  }

  function wireHistory(){
    document.querySelectorAll("[data-week-toggle]").forEach(function(el){
      el.addEventListener("click", function(){
        var id = this.dataset.weekToggle;
        App.historyOpen = (App.historyOpen===id) ? null : id;
        App.histEditRound = null;
        App.histDraft = {};
        render();
      });
    });
    document.querySelectorAll("[data-view-recap]").forEach(function(el){
      el.addEventListener("click", function(ev){
        ev.stopPropagation();
        App.recapWeekId = this.dataset.viewRecap;
        App.recapReturnView = "history";
        App.view = "recap";
        render();
      });
    });
    document.querySelectorAll("[data-edit-round]").forEach(function(el){
      el.addEventListener("click", function(){
        App.histEditRound = parseInt(this.dataset.editRound,10);
        App.histDraft = {};
        render();
      });
    });
    document.querySelectorAll("[data-cancel-round]").forEach(function(el){
      el.addEventListener("click", function(){
        App.histEditRound = null;
        App.histDraft = {};
        render();
      });
    });
    var wk = App.weekHistory.find(function(w){ return w.id===App.historyOpen; });
    if(!wk) return;
    var round = (wk.rounds||[]).find(function(r){ return r.index===App.histEditRound; });
    if(!round) return;
    document.querySelectorAll("[data-hcourt]").forEach(function(inp){
      inp.addEventListener("input", function(){
        var c = this.dataset.hcourt, side = this.dataset.hside;
        var field = side==="teamA" ? "scoreA" : "scoreB";
        var v = this.value==="" ? null : parseInt(this.value,10);
        App.histDraft[c] = App.histDraft[c] || {};
        App.histDraft[c][field] = (v==null||isNaN(v)) ? null : v;
        var saveBtn = document.querySelector('[data-save-round="'+round.index+'"]');
        if(saveBtn) saveBtn.disabled = histMissing(round).length>0;
      });
    });
    document.querySelectorAll("[data-save-round]").forEach(function(el){
      el.addEventListener("click", function(){
        el.disabled = true;
        saveHistoryRound(wk, round).then(function(){
          App.histEditRound = null;
          App.histDraft = {};
        }).catch(function(){ el.disabled = false; });
      });
    });
  }

  byId("tabs").addEventListener("click", function(e){
    var b = e.target.closest("button[data-view]");
    if(!b) return;
    App.view = b.dataset.view;
    App.detailPlayer = null;
    App.confirmFinalize = false;
    App.confirmUnlock = false;
    App.confirmDropout = null;
    App.confirmStartWeek = false;
    App.confirmCourtAction = null;
    App.historyOpen = null;
    App.histEditRound = null;
    App.histDraft = {};
    App.recapWeekId = null;
    App.editMatchupCourt = null;
    App.swapPanelOpen = false;
    render();
  });

  init();
})();
</script>
