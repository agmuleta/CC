<title>Challenge Courts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root{
    --bg:#F0F4F2;
    --surface:#FFFFFF;
    --surface-2:#E7EDEA;
    --ink:#0F262E;
    --ink-soft:#4E6A70;
    --ink-faint:#8AA1A4;
    --line:#D6E0DC;
    --court:#1B4B63;
    --court-soft:#E5EEF2;
    --accent:#CFE23B;
    --accent-ink:#1B2400;
    --bench:#E4573D;
    --bench-soft:#FBE4DE;
    --win:#2E8B57;
    --shadow: 0 1px 2px rgba(15,38,46,.06), 0 6px 20px rgba(15,38,46,.06);
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0D1A1E;
      --surface:#132832;
      --surface-2:#1B333D;
      --ink:#E9F2F0;
      --ink-soft:#9FBAC0;
      --ink-faint:#5F8188;
      --line:#25454F;
      --court:#5FB4D6;
      --court-soft:#173544;
      --accent:#D7E639;
      --accent-ink:#141B00;
      --bench:#FF7A5C;
      --bench-soft:#3A241E;
      --win:#4FCB86;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0D1A1E;
    --surface:#132832;
    --surface-2:#1B333D;
    --ink:#E9F2F0;
    --ink-soft:#9FBAC0;
    --ink-faint:#5F8188;
    --line:#25454F;
    --court:#5FB4D6;
    --court-soft:#173544;
    --accent:#D7E639;
    --accent-ink:#141B00;
    --bench:#FF7A5C;
    --bench-soft:#3A241E;
    --win:#4FCB86;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"IBM Plex Sans", system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:"Big Shoulders Display","IBM Plex Sans",sans-serif;
    text-transform:uppercase; letter-spacing:.02em; text-wrap:balance;
    margin:0;
  }
  .mono{ font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; }
  button{ font-family:inherit; }
  ::selection{ background:var(--accent); color:var(--accent-ink); }

  header.top{
    position:sticky; top:0; z-index:10;
    background:var(--court); color:#fff;
    padding:14px 16px 0;
    box-shadow:var(--shadow);
  }
  .top-row{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .brand{ display:flex; align-items:baseline; gap:10px; }
  .brand .mark{ font-size:26px; line-height:1; }
  .brand h1{ font-size:22px; font-weight:800; color:#fff; }
  .brand .sub{ font-size:12px; color:rgba(255,255,255,.72); text-transform:uppercase; letter-spacing:.08em; }
  nav.tabs{ display:flex; gap:2px; margin-top:12px; overflow-x:auto; }
  nav.tabs button{
    background:transparent; border:none; color:rgba(255,255,255,.68);
    padding:10px 14px; font-size:13px; font-weight:600; letter-spacing:.02em;
    border-bottom:3px solid transparent; cursor:pointer; white-space:nowrap;
  }
  nav.tabs button.active{ color:#fff; border-bottom-color:var(--accent); }
  nav.tabs button:focus-visible{ outline:2px solid var(--accent); outline-offset:-2px; }

  main{ max-width:900px; margin:0 auto; padding:18px 14px 64px; }
  .panel{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); }
  .panel + .panel{ margin-top:14px; }
  .panel-pad{ padding:16px; }
  .stack{ display:flex; flex-direction:column; gap:14px; }

  .banner{
    display:flex; align-items:center; gap:10px;
    background:var(--court-soft); color:var(--ink);
    border:1px solid var(--line); border-radius:var(--radius);
    padding:12px 14px; font-size:13px; line-height:1.5;
  }
  .banner b{ color:var(--court); }
  :root[data-theme="dark"] .banner b, @media (prefers-color-scheme:dark){ .banner b{ color:var(--court);} }

  .round-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .round-head .display{ font-size:26px; color:var(--court); }
  .round-head .meta{ font-size:12px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.06em; }

  .ladder{ display:flex; flex-direction:column; gap:10px; }
  .court-card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:12px; box-shadow:var(--shadow); position:relative;
  }
  .court-card.zone{ border-color:var(--bench); }
  .court-card-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .court-num{ display:flex; align-items:center; gap:8px; }
  .court-num .num{ font-family:"Big Shoulders Display"; font-size:22px; font-weight:800; color:var(--court); }
  .court-num .lbl{ font-size:11px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.08em; }
  .zone-chip{ font-size:10px; background:var(--bench-soft); color:var(--bench); padding:3px 7px; border-radius:99px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
  .team-row{ display:grid; grid-template-columns:1fr 64px; gap:8px; align-items:center; padding:6px 0; }
  .team-row + .team-row{ border-top:1px dashed var(--line); }
  .team-names{ font-size:14.5px; font-weight:500; }
  .team-names .amp{ color:var(--ink-faint); font-weight:400; margin:0 3px; }
  .team-row.won .team-names{ color:var(--win); font-weight:700; }
  .team-row.won .team-names::after{ content:" \2713"; }
  .team-row.lost .team-names{ color:var(--ink-faint); }
  .team-row.lost .score-input{ opacity:.7; }
  .score-input{
    width:64px; text-align:center; padding:8px 4px; border-radius:8px;
    border:1px solid var(--line); background:var(--surface-2); color:var(--ink);
    font-family:"IBM Plex Mono"; font-size:16px; font-variant-numeric:tabular-nums;
  }
  .score-input:focus{ outline:2px solid var(--court); outline-offset:1px; }
  .score-warn{ font-size:11px; color:var(--bench); margin-top:4px; }

  .bench-strip{ background:var(--bench-soft); border:1px solid var(--bench); border-radius:var(--radius); padding:12px 14px; }
  .bench-strip h3{ font-size:12px; color:var(--bench); text-transform:uppercase; letter-spacing:.08em; margin-bottom:6px; }
  .bench-names{ display:flex; flex-wrap:wrap; gap:6px; }
  .bench-pill{ background:var(--surface); border:1px solid var(--bench); color:var(--ink); font-size:12.5px; padding:4px 10px; border-radius:99px; font-weight:500; }
  .bench-pill .pos{ color:var(--bench); font-weight:700; margin-right:4px; }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    background:var(--court); color:#fff; border:none; border-radius:10px;
    padding:12px 18px; font-size:14px; font-weight:700; letter-spacing:.02em;
    cursor:pointer; text-transform:uppercase;
  }
  .btn:disabled{ background:var(--surface-2); color:var(--ink-faint); cursor:not-allowed; }
  .btn.accent{ background:var(--accent); color:var(--accent-ink); }
  .btn.ghost{ background:transparent; color:var(--court); border:1px solid var(--line); text-transform:none; font-weight:600; padding:9px 14px; }
  .btn.small{ padding:7px 12px; font-size:12px; }
  .btn.danger{ background:var(--bench); }
  .actions{ display:flex; gap:10px; flex-wrap:wrap; justify-content:flex-end; }

  table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  th,td{ padding:9px 10px; text-align:left; border-bottom:1px solid var(--line); white-space:nowrap; }
  th{ font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); font-weight:600; cursor:pointer; user-select:none; }
  th.sorted{ color:var(--court); }
  td.num, th.num{ text-align:right; font-family:"IBM Plex Mono"; }
  tbody tr:hover{ background:var(--surface-2); cursor:pointer; }
  .table-wrap{ overflow-x:auto; border-radius:var(--radius); }
  .rank-pill{ display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; border-radius:50%; background:var(--court-soft); color:var(--court); font-size:11px; font-weight:700; font-family:"IBM Plex Mono"; }

  .roster-row{ display:flex; align-items:center; gap:10px; padding:10px 12px; border-bottom:1px solid var(--line); }
  .roster-row:last-child{ border-bottom:none; }
  .roster-row .name{ flex:1; font-weight:600; font-size:14px; }
  .roster-row .name .g{ color:var(--ink-faint); font-weight:400; font-size:11px; margin-left:6px; text-transform:uppercase; }
  .pill{ font-size:10.5px; padding:4px 9px; border-radius:99px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; }
  .pill.confirmed{ background:var(--court-soft); color:var(--court); }
  .pill.waitlist{ background:var(--bench-soft); color:var(--bench); }
  .rowbtns{ display:flex; gap:6px; }
  .iconbtn{ background:var(--surface-2); border:1px solid var(--line); color:var(--ink-soft); width:28px; height:28px; border-radius:8px; cursor:pointer; font-size:13px; display:flex; align-items:center; justify-content:center; }
  .iconbtn:hover{ background:var(--court-soft); color:var(--court); }

  .stat-hero{ display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr)); gap:1px; background:var(--line); border-radius:var(--radius); overflow:hidden; border:1px solid var(--line); }
  .stat-hero .cell{ background:var(--surface); padding:14px 12px; }
  .stat-hero .cell .v{ font-family:"IBM Plex Mono"; font-size:22px; font-weight:600; }
  .stat-hero .cell .l{ font-size:10.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.05em; margin-top:2px; }

  .detail-close{ float:right; }
  .h2h-pick{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  select{ font-family:inherit; padding:9px 10px; border-radius:8px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font-size:13.5px; }

  .empty{ color:var(--ink-faint); font-size:13.5px; padding:20px; text-align:center; }
  .section-title{ font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-faint); font-weight:600; margin-bottom:2px; }
  .week-card{ padding:14px 16px; }
  .week-card-head{ display:flex; justify-content:space-between; align-items:center; cursor:pointer; }
  .week-seed{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; margin-top:10px; }
  .week-seed .c{ background:var(--surface-2); border-radius:10px; padding:8px 10px; font-size:12.5px; }
  .week-seed .c b{ display:block; color:var(--court); font-size:11px; text-transform:uppercase; letter-spacing:.04em; margin-bottom:3px; }

  [hidden]{ display:none !important; }
  @media (max-width:480px){
    .team-row{ grid-template-columns:1fr 56px; }
    .stat-hero{ grid-template-columns:repeat(3,1fr); }
  }
</style>

<header class="top">
  <div class="top-row">
    <div class="brand">
      <span class="mark">🏓</span>
      <div>
        <h1>Challenge Courts</h1>
        <div class="sub">Ladder &amp; Stats Tracker</div>
      </div>
    </div>
  </div>
  <nav class="tabs" id="tabs">
    <button data-view="live" class="active">Live Round</button>
    <button data-view="standings">Standings</button>
    <button data-view="roster">Roster &amp; Signup</button>
    <button data-view="history">History</button>
  </nav>
</header>

<main id="app">
  <div class="empty">Loading…</div>
</main>

<script>
(function(){
  "use strict";

  var ROSTER_SEED = [
    {id:"ben", name:"Ben", gender:"M"},
    {id:"mikey", name:"Mikey", gender:"M"},
    {id:"charlie", name:"Charlie", gender:"F"},
    {id:"sienna", name:"Sienna", gender:"F"},
    {id:"bradon", name:"Bradon", gender:"M"},
    {id:"andrew", name:"Andrew", gender:"M"},
    {id:"jj-lebo", name:"JJ Lebo", gender:"M"},
    {id:"cole", name:"Cole", gender:"M"},
    {id:"hamza", name:"Hamza", gender:"M"},
    {id:"caeden", name:"Caeden", gender:"M"},
    {id:"matthew", name:"Matthew", gender:"M"},
    {id:"dice", name:"Dice", gender:"M"},
    {id:"titus", name:"Titus", gender:"M"},
    {id:"nathan", name:"Nathan", gender:"M"},
    {id:"luke", name:"Luke", gender:"M"},
    {id:"jason-rice", name:"Jason Rice", gender:"M"},
    {id:"isaac", name:"Isaac", gender:"M"},
    {id:"analise", name:"Analise", gender:"F"},
    {id:"tony", name:"Tony", gender:"M"},
    {id:"andrew-loughan", name:"Andrew Loughan", gender:"M"},
    {id:"allie", name:"Allie", gender:"F"},
    {id:"maiya", name:"Maiya", gender:"F"},
    {id:"rizz", name:"Rizz", gender:"M"},
    {id:"laci", name:"Laci", gender:"F"},
    {id:"brody", name:"Brody", gender:"M"},
    {id:"joel", name:"Joel", gender:"M"},
    {id:"jj-wallen", name:"JJ Wallen", gender:"M"},
    {id:"mia", name:"Mia", gender:"F"},
    {id:"maelen", name:"Maelen", gender:"F"}
  ];
  var INITIAL_RANK = ROSTER_SEED.map(function(p){ return p.id; });

  var WEEK1_COURTS = {
    1:{teamA:["ben","mikey"], teamB:["charlie","sienna"], scoreA:null, scoreB:null},
    2:{teamA:["bradon","andrew"], teamB:["jj-lebo","cole"], scoreA:null, scoreB:null},
    3:{teamA:["hamza","caeden"], teamB:["matthew","dice"], scoreA:null, scoreB:null},
    4:{teamA:["titus","nathan"], teamB:["luke","jason-rice"], scoreA:null, scoreB:null},
    5:{teamA:["isaac","analise"], teamB:["tony","andrew-loughan"], scoreA:null, scoreB:null},
    6:{teamA:["allie","maiya"], teamB:["rizz","laci"], scoreA:null, scoreB:null}
  };
  var WEEK1_BENCH = ["joel","jj-wallen","mia","maelen"]; // Brody is out for Week 1

  var App = {
    db: null,
    view: "live",
    roster: [],
    meta: null,
    week: null,
    weekHistory: [],
    unsubWeek: null,
    detailPlayer: null,
    sortCol: "courtPoints",
    sortDir: "desc",
    draft: {},
    draftKey: null,
    confirmFinalize: false,
    confirmUnlock: false,
    confirmDropout: null,
    confirmStartWeek: false,
    confirmCourtAction: null,
    historyOpen: null,
    histEditRound: null,
    histDraft: {},
    recapWeekId: null,
    recapReturnView: "roster",
    editMatchupCourt: null,
    swapPanelOpen: false
  };

  function byId(id){ return document.getElementById(id); }
  function nameOf(id){
    var p = App.roster.find(function(r){ return r.id===id; });
    return p ? p.name : id;
  }
  function genderOf(id){
    var p = App.roster.find(function(r){ return r.id===id; });
    return p ? p.gender : "";
  }
  function shuffle(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var t=a[i]; a[i]=a[j]; a[j]=t;
    }
    return a;
  }
  function teammateMapOf(courts){
    var m = {};
    Object.keys(courts).forEach(function(c){
      var court = courts[c];
      if(!court) return;
      var a = court.teamA, b = court.teamB;
      if(a && a.length===2){ m[a[0]]=a[1]; m[a[1]]=a[0]; }
      if(b && b.length===2){ m[b[0]]=b[1]; m[b[1]]=b[0]; }
    });
    return m;
  }
  // Every pairing that's already happened this week, strictly before
  // beforeIndex — used to flag repeat partnerships in the matchup picker.
  function priorPartnerPairs(week, beforeIndex){
    var pairs = {};
    (week.rounds||[]).forEach(function(r){
      if(r.index>=beforeIndex) return;
      Object.keys(r.courts).forEach(function(cnum){
        var ct = r.courts[cnum];
        [ct.teamA, ct.teamB].forEach(function(team){
          if(team && team[0] && team[1]) pairs[[team[0],team[1]].sort().join("|")] = true;
        });
      });
    });
    return pairs;
  }
  function havePlayedTogether(pairsSet, a, b){
    return !!pairsSet[[a,b].sort().join("|")];
  }
  function pairUp(arrivals, teammateMap){
    if(arrivals.length < 4){
      return {teamA:arrivals.slice(0,2), teamB:arrivals.slice(2,4)};
    }
    var best = null;
    for(var attempt=0; attempt<20; attempt++){
      var s = shuffle(arrivals);
      var teamA = [s[0],s[1]], teamB=[s[2],s[3]];
      var repeats = (teammateMap[teamA[0]]===teamA[1]) || (teammateMap[teamB[0]]===teamB[1]);
      if(!repeats) return {teamA:teamA, teamB:teamB};
      best = {teamA:teamA, teamB:teamB};
    }
    return best;
  }
  // Snapshot data from the db is frozen and must never be mutated in place.
  // In-progress score entry lives in App.draft (plain, mutable, local-only)
  // and is merged over the persisted court data purely for reading/display.
  function courtView(round, c){
    var base = round.courts[c];
    var d = App.draft[c];
    return {
      teamA: base.teamA,
      teamB: base.teamB,
      scoreA: (d && d.scoreA!==undefined) ? d.scoreA : base.scoreA,
      scoreB: (d && d.scoreB!==undefined) ? d.scoreB : base.scoreB
    };
  }
  function courtCount(round){
    return Object.keys(round.courts).length;
  }
  function mergedCourts(round){
    var m = {};
    var n = courtCount(round);
    for(var c=1;c<=n;c++){ m[c] = courtView(round,c); }
    return m;
  }
  function winnerLoser(court){
    if(court.scoreA==null || court.scoreB==null) return null;
    if(court.scoreA > court.scoreB) return {winner:court.teamA, loser:court.teamB};
    if(court.scoreB > court.scoreA) return {winner:court.teamB, loser:court.teamA};
    return null;
  }
  function seedGroupOf4(ids){
    // balanced seed: best+worst vs middle two
    return {teamA:[ids[0], ids[3]].filter(Boolean), teamB:[ids[1], ids[2]].filter(Boolean)};
  }

  // Generalized up-down ladder for any number of active courts (1-6), so
  // courts can be added or removed between rounds without changing the
  // rotation rules. Court N-1 always pulls court N's winner up (that spot
  // needs refilling whether N-1's own loser went to court N or to the
  // bench) — the only thing bench mode changes is where N-1's and N's
  // losers go, and where court N's players come from.
  function computeNextRound(prevCourts, benchQueueIn, activeCourts){
    var N = activeCourts;
    var res = {};
    for(var c=1;c<=N;c++){ res[c] = winnerLoser(prevCourts[c]); }
    var hasBench = !!(benchQueueIn && benchQueueIn.length>0);
    var arrivals = {};
    for(var c=1;c<=N;c++){ arrivals[c] = []; }
    var newBenchQueue = benchQueueIn || [];

    if(N===1){
      arrivals[1] = res[1].winner.concat(res[1].loser);
    } else {
      for(var c=1; c<=N-2; c++){
        var stayOrDown = (c===1) ? res[1].winner : res[c-1].loser;
        arrivals[c] = stayOrDown.concat(res[c+1].winner);
      }
      var downFromAbove = (N-1===1) ? res[1].winner : res[N-2].loser;
      arrivals[N-1] = downFromAbove.concat(res[N].winner);
      if(hasBench){
        arrivals[N] = benchQueueIn.slice(0,4);
        newBenchQueue = benchQueueIn.slice(4).concat(res[N-1].loser, res[N].loser);
      } else {
        arrivals[N] = res[N-1].loser.concat(res[N].loser);
        newBenchQueue = benchQueueIn || [];
      }
    }

    var teammateMap = teammateMapOf(prevCourts);
    var newCourts = {};
    for(var cc=1; cc<=N; cc++){
      var pr = pairUp(arrivals[cc], teammateMap);
      newCourts[cc] = {teamA:pr.teamA, teamB:pr.teamB, scoreA:null, scoreB:null};
    }
    return {courts:newCourts, benchQueue:newBenchQueue};
  }

  // ---------- DB ----------
  function weekDocPath(id){ return "weeks/" + id; }

  function seedIfNeeded(db){
    return db.collection("roster").get().then(function(snap){
      if(snap.empty){
        var writes = ROSTER_SEED.map(function(p){
          return db.collection("roster").doc(p.id).set({name:p.name, gender:p.gender});
        });
        return Promise.all(writes);
      }
    }).then(function(){
      return db.doc("meta/state").get();
    }).then(function(metaSnap){
      if(!metaSnap.exists){
        return db.doc("weeks/week-1").set({
          number:1, label:"Week 1",
          confirmed: INITIAL_RANK.slice(0,24),
          finalized:false, finalSeeding:null, finalCourtCount:null,
          rounds:[{
            index:0,
            courts: WEEK1_COURTS,
            benchSnapshot: WEEK1_BENCH,
            benchQueueBefore: []
          }],
          benchQueue: WEEK1_BENCH
        }).then(function(){
          return db.doc("meta/state").set({
            activeWeekId:"week-1",
            nextWeekNumber:2,
            rankOrder: INITIAL_RANK,
            signup:{ weekNumber:2, entries:[] }
          });
        });
      }
    });
  }

  function subscribeWeek(id){
    if(App.unsubWeek) App.unsubWeek();
    App.unsubWeek = App.db.doc(weekDocPath(id)).onSnapshot(function(snap){
      App.week = snap.exists ? Object.assign({id:snap.id}, snap.data()) : null;
      render();
    });
  }

  function init(){
    if(!window.claude || !window.claude.use){ boot(null); return; }
    window.claude.use("db").then(function(db){ boot(db); }).catch(function(){ boot(null); });
  }

  function boot(db){
    App.db = db;
    if(!db){
      byId("app").innerHTML = '<div class="panel panel-pad empty">This view can\'t reach live storage right now, so scores can\'t be saved from here. Reopen the published page to try again.</div>';
      return;
    }
    seedIfNeeded(db).then(function(){
      db.collection("roster").onSnapshot(function(snap){
        App.roster = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
        render();
      });
      db.doc("meta/state").onSnapshot(function(snap){
        App.meta = snap.exists ? snap.data() : null;
        if(App.meta && App.meta.activeWeekId) subscribeWeek(App.meta.activeWeekId);
        render();
      });
      db.collection("weeks").orderBy("number","desc").limit(60).onSnapshot(function(snap){
        App.weekHistory = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
        render();
      });
    });
  }

  // ---------- stats engine ----------
  // Winning on a higher court is worth more toward standings than winning
  // on a lower one. Unknown/out-of-range court numbers score 0.
  var COURT_POINT_VALUES = {1:3, 2:2.5, 3:2, 4:1.5, 5:1, 6:0.5};
  function courtPointValue(cnum){
    var v = COURT_POINT_VALUES[parseInt(cnum,10)];
    return v==null ? 0 : v;
  }

  // Standings methodology: Court Points (wins weighted by which court they
  // came on) is the main factor, then W/L record, then point differential
  // — in that order, as a tiebreaker no matter which column is sorted, and
  // as the sole ranking whenever the Standings page itself sorts by rank.
  var RECORD_TIEBREAK = ["courtPoints","winPct","diff","gw","pdiff","pwinPct"];
  function statsTied(a,b){
    for(var i=0;i<RECORD_TIEBREAK.length;i++){
      if(a[RECORD_TIEBREAK[i]] !== b[RECORD_TIEBREAK[i]]) return false;
    }
    return true;
  }

  function computeStats(){
    var players = {};
    App.roster.forEach(function(p){
      players[p.id] = {
        id:p.id, name:p.name, gender:p.gender,
        gw:0, gl:0, pf:0, pa:0, courtPoints:0, sessions:{},
        partners:{}, opponents:{}
      };
    });
    function ensure(id){
      if(!players[id]) players[id] = {id:id,name:nameOf(id),gender:genderOf(id),gw:0,gl:0,pf:0,pa:0,courtPoints:0,sessions:{},partners:{},opponents:{}};
      return players[id];
    }
    App.weekHistory.forEach(function(wk){
      (wk.rounds||[]).forEach(function(round){
        Object.keys(round.courts||{}).forEach(function(cnum){
          var court = round.courts[cnum];
          if(court.scoreA==null || court.scoreB==null) return;
          var teams = [
            {ids:court.teamA, score:court.scoreA, opp:court.scoreB},
            {ids:court.teamB, score:court.scoreB, opp:court.scoreA}
          ];
          var won = court.scoreA > court.scoreB ? court.teamA : court.teamB;
          teams.forEach(function(t){
            if(!t.ids || t.ids.length<2) return;
            var isWin = t.score > t.opp;
            var otherTeam = (t.ids===court.teamA)? court.teamB : court.teamA;
            t.ids.forEach(function(pid, idx){
              var pl = ensure(pid);
              pl.sessions[wk.id] = true;
              if(isWin){ pl.gw++; pl.courtPoints += courtPointValue(cnum); } else { pl.gl++; }
              pl.pf += t.score; pl.pa += t.opp;
              var partnerId = t.ids[1-idx];
              if(partnerId){
                if(!pl.partners[partnerId]) pl.partners[partnerId] = {w:0,l:0};
                if(isWin) pl.partners[partnerId].w++; else pl.partners[partnerId].l++;
              }
              otherTeam.forEach(function(oppId){
                if(!pl.opponents[oppId]) pl.opponents[oppId] = {w:0,l:0,pf:0,pa:0};
                if(isWin) pl.opponents[oppId].w++; else pl.opponents[oppId].l++;
                pl.opponents[oppId].pf += t.score;
                pl.opponents[oppId].pa += t.opp;
              });
            });
          });
        });
      });
    });
    var list = Object.keys(players).map(function(id){
      var p = players[id];
      var gp = p.gw + p.gl;
      var sessions = Object.keys(p.sessions).length;
      var bestPartner = null;
      Object.keys(p.partners).forEach(function(pid){
        var s = p.partners[pid];
        var gpp = s.w+s.l;
        if(gpp < 2) return;
        var wp = s.w/gpp;
        if(!bestPartner || wp > bestPartner.winPct || (wp===bestPartner.winPct && gpp>bestPartner.games)){
          bestPartner = {id:pid, name:nameOf(pid), games:gpp, wins:s.w, winPct:wp};
        }
      });
      return {
        id:p.id, name:p.name, gender:p.gender,
        gw:p.gw, gl:p.gl, gp:gp, diff:p.gw-p.gl,
        courtPoints: p.courtPoints,
        winPct: gp? p.gw/gp : 0,
        pf:p.pf, pa:p.pa, pdiff:p.pf-p.pa,
        pwinPct: (p.pf+p.pa)? p.pf/(p.pf+p.pa) : 0,
        sessions:sessions,
        bestPartner:bestPartner,
        partners:p.partners, opponents:p.opponents
      };
    });
    return list;
  }

  // Live season-standings order of every rostered player, used to seed new
  // weeks' courts (Court 1 = ranks 1-4, Court 2 = ranks 5-8, etc). Players
  // fully tied on every Standings stat keep their relative order from
  // App.meta.rankOrder (adjustable via the roster's rank arrows), which
  // matters most in Week 1 or for anyone who hasn't played yet.
  function standingsOrder(){
    var stats = computeStats();
    var tieRef = (App.meta && App.meta.rankOrder) || INITIAL_RANK;
    var tieIndex = {};
    tieRef.forEach(function(id, idx){ tieIndex[id] = idx; });
    stats.sort(function(a,b){
      for(var i=0;i<RECORD_TIEBREAK.length;i++){
        var k = RECORD_TIEBREAK[i];
        if(a[k]!==b[k]) return b[k]-a[k];
      }
      var ai = tieIndex.hasOwnProperty(a.id) ? tieIndex[a.id] : Infinity;
      var bi = tieIndex.hasOwnProperty(b.id) ? tieIndex[b.id] : Infinity;
      if(ai!==bi) return ai-bi;
      return a.name.localeCompare(b.name);
    });
    return stats.map(function(p){ return p.id; });
  }

  function bestPairingsGlobal(stats){
    var seen = {};
    var pairs = [];
    stats.forEach(function(p){
      Object.keys(p.partners).forEach(function(pid){
        var key = [p.id,pid].sort().join("|");
        if(seen[key]) return; seen[key]=true;
        var s = p.partners[pid];
        var gp = s.w+s.l;
        if(gp < 3) return;
        pairs.push({a:p.id, b:pid, games:gp, wins:s.w, winPct:s.w/gp});
      });
    });
    pairs.sort(function(a,b){ return b.winPct-a.winPct || b.games-a.games; });
    return pairs.slice(0,5);
  }

  // Week-scoped storyline stats for the post-session recap — deliberately
  // separate from computeStats(), which is season-long.
  function buildWeekRecap(week){
    var rounds = week.rounds || [];
    var games = [];
    rounds.forEach(function(r, ri){
      Object.keys(r.courts).forEach(function(cnum){
        var ct = r.courts[cnum];
        if(ct.scoreA==null || ct.scoreB==null) return;
        var winnerIsA = ct.scoreA > ct.scoreB;
        games.push({
          round: ri+1, court: +cnum,
          teamA: ct.teamA, teamB: ct.teamB, scoreA: ct.scoreA, scoreB: ct.scoreB,
          winner: winnerIsA ? ct.teamA : ct.teamB,
          loser: winnerIsA ? ct.teamB : ct.teamA,
          margin: Math.abs(ct.scoreA - ct.scoreB)
        });
      });
    });

    var players = {};
    function ensure(id){ if(!players[id]) players[id] = {id:id, gw:0, gl:0, partners:{}}; return players[id]; }
    games.forEach(function(g){
      [{ids:g.teamA, win:g.winner===g.teamA}, {ids:g.teamB, win:g.winner===g.teamB}].forEach(function(t){
        t.ids.forEach(function(pid, idx){
          if(!pid) return;
          var pl = ensure(pid);
          if(t.win) pl.gw++; else pl.gl++;
          var partnerId = t.ids[1-idx];
          if(partnerId){
            pl.partners[partnerId] = pl.partners[partnerId] || {w:0,l:0};
            if(t.win) pl.partners[partnerId].w++; else pl.partners[partnerId].l++;
          }
        });
      });
    });

    var firstRound = rounds[0], lastRound = rounds[rounds.length-1];
    var startCourt = {}, endCourt = {};
    if(firstRound) Object.keys(firstRound.courts).forEach(function(cnum){
      firstRound.courts[cnum].teamA.concat(firstRound.courts[cnum].teamB).forEach(function(pid){ if(pid) startCourt[pid] = +cnum; });
    });
    if(lastRound) Object.keys(lastRound.courts).forEach(function(cnum){
      lastRound.courts[cnum].teamA.concat(lastRound.courts[cnum].teamB).forEach(function(pid){ if(pid) endCourt[pid] = +cnum; });
    });
    var movers = Object.keys(startCourt)
      .filter(function(id){ return endCourt[id]!=null; })
      .map(function(id){ return {id:id, start:startCourt[id], end:endCourt[id], delta:startCourt[id]-endCourt[id]}; });
    movers.sort(function(a,b){ return b.delta-a.delta; });
    var biggestRiser = (movers[0] && movers[0].delta>0) ? movers[0] : null;
    var fallers = movers.slice().sort(function(a,b){ return a.delta-b.delta; });
    var biggestFaller = (fallers[0] && fallers[0].delta<0) ? fallers[0] : null;

    var byMargin = games.slice().sort(function(a,b){ return a.margin-b.margin; });
    var closest = byMargin[0] || null;
    var blowout = byMargin.length ? byMargin[byMargin.length-1] : null;

    var totalRounds = rounds.length;
    var perfect = Object.keys(players).filter(function(id){
      var p = players[id]; var gp = p.gw+p.gl;
      return gp>=2 && gp>=totalRounds && p.gl===0;
    });

    var seenPairs = {}, pairs = [];
    Object.keys(players).forEach(function(id){
      var p = players[id];
      Object.keys(p.partners).forEach(function(pid){
        var key = [id,pid].sort().join("|");
        if(seenPairs[key]) return; seenPairs[key]=true;
        var s = p.partners[pid]; var gp = s.w+s.l;
        if(gp<2) return;
        pairs.push({a:id, b:pid, games:gp, wins:s.w, winPct:s.w/gp});
      });
    });
    pairs.sort(function(a,b){ return b.winPct-a.winPct || b.games-a.games; });

    var court1 = lastRound && lastRound.courts["1"];
    var topCourtWinner = null, topCourtBoth = [];
    if(court1){
      topCourtBoth = court1.teamA.concat(court1.teamB).filter(Boolean);
      if(court1.scoreA!=null && court1.scoreB!=null && court1.scoreA!==court1.scoreB){
        topCourtWinner = court1.scoreA>court1.scoreB ? court1.teamA : court1.teamB;
      }
    }
    var totalPoints = games.reduce(function(s,g){ return s+g.scoreA+g.scoreB; }, 0);

    return {
      totalRounds: totalRounds, totalGames: games.length, totalPoints: totalPoints,
      biggestRiser: biggestRiser, biggestFaller: biggestFaller,
      closest: closest, blowout: blowout,
      perfect: perfect, bestPair: pairs[0] || null,
      topCourtWinner: topCourtWinner, topCourtBoth: topCourtBoth
    };
  }

  // ---------- rendering ----------
  function render(){
    byId("tabs").querySelectorAll("button").forEach(function(b){
      b.classList.toggle("active", b.dataset.view===App.view);
    });
    if(!App.meta || !App.week){
      byId("app").innerHTML = '<div class="panel panel-pad empty">Loading league data…</div>';
      return;
    }
    if(App.view==="live") renderLive();
    else if(App.view==="standings") renderStandings();
    else if(App.view==="roster") renderRoster();
    else if(App.view==="history") renderHistory();
    else if(App.view==="recap"){
      var recapWeek = App.weekHistory.find(function(w){ return w.id===App.recapWeekId; }) || App.week;
      renderRecap(recapWeek);
    }
  }

  function pct(n){ return (n*100).toFixed(0)+"%"; }
  function pct1(n){ return (n*100).toFixed(1)+"%"; }

  function renderLive(){
    var week = App.week;
    var round = week.rounds[week.rounds.length-1];
    var isLast = true;
    var N = courtCount(round);
    var hasBench = !!(week.benchQueue && week.benchQueue.length>0);
    var html = "";

    var roundKey = week.id + ":" + round.index;
    if(App.draftKey !== roundKey){
      App.draft = {};
      App.draftKey = roundKey;
      App.editMatchupCourt = null;
      App.swapPanelOpen = false;
    }

    html += '<div class="stack">';
    if(hasBench && N>=2){
      html += '<div class="banner"><span>🧭</span><span><b>Bench mode active.</b> Losers on Court '+(N-1)+' and Court '+N+' go straight to the bench &mdash; the winner of Court '+N+' slides up to Court '+(N-1)+', so Court '+N+' empties out and refills from the front of the bench queue. Win twice in a row from Court '+N+' to reach Court '+(N-2>=1?N-2:1)+' and be safe.</span></div>';
    }

    html += '<div class="panel panel-pad">';
    html += '<div class="round-head"><div><div class="display">'+week.label+'</div><div class="meta">Round '+(round.index+1)+' &middot; '+(hasBench ? "Bench mode" : N+" court"+(N===1?'':'s')+" &middot; "+(N*4)+" players")+'</div></div>';
    if(!week.finalized){
      if(App.confirmFinalize){
        html += '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">'
          + '<span style="font-size:12px;color:var(--bench);max-width:260px;">Save today\'s scores, lock in next week\'s seeding, and show the recap?</span>'
          + '<button class="btn danger small" id="btnFinalizeYes">Yes, complete week</button>'
          + '<button class="btn ghost small" id="btnFinalizeNo">Cancel</button>'
          + '</div>';
      } else {
        html += '<button class="btn accent small" id="btnFinalize">Complete week</button>';
      }
    } else if(App.confirmUnlock){
      html += '<div style="display:flex;align-items:center;gap:8px;">'
        + '<span style="font-size:12px;color:var(--bench);max-width:220px;">Unlock to edit this week\'s scores? If you\'ve already started next week off these results, its lineup won\'t recalculate.</span>'
        + '<button class="btn danger small" id="btnUnlockYes">Yes, unlock</button>'
        + '<button class="btn ghost small" id="btnUnlockNo">Cancel</button>'
        + '</div>';
    } else {
      html += '<div style="display:flex;align-items:center;gap:8px;"><span class="pill confirmed">Finalized</span><button class="btn ghost small" id="btnUnlock">Unlock to edit</button></div>';
    }
    html += '</div></div>';

    html += '<div class="ladder">';
    var pairsSoFar = priorPartnerPairs(week, round.index);
    for(var c=1;c<=N;c++){
      var court = courtView(round, c);
      var zone = (hasBench && N>=2 && (c===N-1||c===N));
      var wl = winnerLoser(court);
      var courtHasScore = court.scoreA!=null || court.scoreB!=null;
      html += '<div class="court-card'+(zone?' zone':'')+'" data-court="'+c+'">';
      html += '<div class="court-card-head"><div class="court-num"><span class="num">'+c+'</span><span class="lbl">Court</span></div>';
      if(zone) html += '<span class="zone-chip">Loser sits</span>';
      if(!week.finalized && !courtHasScore && App.editMatchupCourt!==c){
        html += '<button class="btn ghost small" data-edit-matchup="'+c+'" style="padding:4px 10px;font-size:11px;">Edit matchup</button>';
      }
      html += '</div>';

      if(App.editMatchupCourt===c){
        var pool = court.teamA.concat(court.teamB);
        var splits = [
          [[pool[0],pool[1]],[pool[2],pool[3]]],
          [[pool[0],pool[2]],[pool[1],pool[3]]],
          [[pool[0],pool[3]],[pool[1],pool[2]]]
        ];
        html += '<div style="font-size:11.5px;color:var(--ink-soft);margin-bottom:8px;">Pick who plays with who on Court '+c+':</div>';
        splits.forEach(function(sp, i){
          var warn = havePlayedTogether(pairsSoFar, sp[0][0], sp[0][1]) || havePlayedTogether(pairsSoFar, sp[1][0], sp[1][1]);
          html += '<button type="button" class="btn ghost" data-pick-split="'+i+'" data-court-edit="'+c+'" style="display:flex;width:100%;justify-content:space-between;align-items:center;margin-bottom:6px;text-transform:none;font-weight:500;'+(warn?'border-color:var(--bench);':'')+'">';
          html += '<span>'+sp[0].map(nameOf).join(' & ')+' <span class="amp">vs</span> '+sp[1].map(nameOf).join(' & ')+'</span>';
          if(warn) html += '<span class="mono" style="color:var(--bench);font-size:10.5px;text-transform:uppercase;">&#9888; repeat partner</span>';
          html += '</button>';
        });
        html += '<button class="btn ghost small" data-cancel-matchup="'+c+'">Cancel</button>';
      } else {
        ["teamA","teamB"].forEach(function(key){
          var team = court[key];
          var won = wl && wl.winner===team;
          var lost = wl && wl.loser===team;
          html += '<div class="team-row'+(won?' won':'')+(lost?' lost':'')+'">';
          html += '<div class="team-names">'+team.map(nameOf).join(' <span class="amp">&amp;</span> ')+'</div>';
          html += '<input class="score-input" type="number" min="0" inputmode="numeric" data-court="'+c+'" data-side="'+key+'" value="'+(court[key.replace('team','score')]==null? '': court[key.replace('team','score')])+'" '+(week.finalized?'disabled':'')+'>';
          html += '</div>';
        });
      }
      html += '</div>';
    }
    html += '</div>';

    if(!week.finalized){
      var lastCourt = courtView(round, N);
      var lastCourtHasScore = lastCourt.scoreA!=null || lastCourt.scoreB!=null;
      var canRemove = N>1 && !lastCourtHasScore;
      var canAdd = N<6 && (week.benchQueue||[]).length>=4;
      html += '<div class="panel-pad" style="padding:10px 16px;border-top:1px solid var(--line);">';
      if(App.confirmCourtAction){
        var act = App.confirmCourtAction;
        if(act==="remove"){
          var leaving = lastCourt.teamA.concat(lastCourt.teamB);
          html += '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;"><span style="font-size:12px;color:var(--bench);">Remove Court '+N+'? '+leaving.map(nameOf).join(", ")+' move to the front of the bench.</span><button class="btn danger small" id="btnCourtYes">Yes, remove</button><button class="btn ghost small" id="btnCourtNo">Cancel</button></div>';
        } else {
          var arriving = (week.benchQueue||[]).slice(0,4);
          html += '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;"><span style="font-size:12px;color:var(--court);">Add Court '+(N+1)+'? '+arriving.map(nameOf).join(", ")+' come off the bench to fill it.</span><button class="btn accent small" id="btnCourtYes">Yes, add</button><button class="btn ghost small" id="btnCourtNo">Cancel</button></div>';
        }
      } else {
        var canSwap = !hasAnyScore(round);
        html += '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">';
        html += '<span class="section-title" style="margin:0;">Courts in play: '+N+'</span>';
        html += '<button class="btn ghost small" id="btnRemoveCourt" '+(canRemove?'':'disabled')+' title="'+(lastCourtHasScore?'Court '+N+' already has a score this round':'Send Court '+N+'\'s players to the bench')+'">&minus; Remove Court '+N+'</button>';
        html += '<button class="btn ghost small" id="btnAddCourt" '+(canAdd?'':'disabled')+' title="'+((week.benchQueue||[]).length<4 && N<6 ?'Needs at least 4 players on the bench':'Bring 4 from the bench onto a new court')+'">&plus; Add Court'+(N<6?' '+(N+1):'')+'</button>';
        html += '<button class="btn ghost small" id="btnSwapToggle" '+(canSwap?'':'disabled')+' title="'+(canSwap?'Move someone who didn\'t show or had to leave':'Can\'t swap once scores are entered this round')+'">&#128256; Swap players</button>';
        html += '</div>';
        if(App.swapPanelOpen && canSwap){
          var participants = [];
          for(var pc=1;pc<=N;pc++){
            var pct2 = round.courts[pc];
            pct2.teamA.concat(pct2.teamB).forEach(function(pid){ participants.push({id:pid, label:nameOf(pid)+' (Court '+pc+')'}); });
          }
          (week.benchQueue||[]).forEach(function(pid){ participants.push({id:pid, label:nameOf(pid)+' (Bench)'}); });
          var optHtml = participants.map(function(p){ return '<option value="'+p.id+'">'+p.label+'</option>'; }).join('');
          var optHtmlB = participants.map(function(p,pi){ return '<option value="'+p.id+'"'+(pi===1?' selected':'')+'>'+p.label+'</option>'; }).join('');
          html += '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;">';
          html += '<select id="swapSelectA">'+optHtml+'</select>';
          html += '<span style="color:var(--ink-faint);">&harr;</span>';
          html += '<select id="swapSelectB">'+optHtmlB+'</select>';
          html += '<button class="btn accent small" id="btnSwapGo">Swap</button>';
          html += '<button class="btn ghost small" id="btnSwapCancel">Cancel</button>';
          html += '</div>';
          html += '<div id="swapWarn" class="score-warn" style="margin-top:4px;"></div>';
        }
      }
      html += '</div>';
    }

    if(hasBench){
      html += '<div class="bench-strip"><h3>Bench queue</h3><div class="bench-names">';
      week.benchQueue.forEach(function(id,i){
        html += '<span class="bench-pill"><span class="pos">'+(i+1)+'</span>'+nameOf(id)+'</span>';
      });
      html += '</div></div>';
    }

    if(!week.finalized){
      html += '<div id="roundStatus" class="score-warn" style="text-align:right;"></div>';
      html += '<div class="actions">';
      if(week.rounds.length>1 && !hasAnyScore(round)){
        html += '<button class="btn ghost" id="btnReopen">Reopen previous round</button>';
      }
      html += '<button class="btn ghost" id="btnSaveCorrection" disabled title="Save these scores without rotating courts">Save without rotating</button>';
      html += '<button class="btn accent" id="btnComplete" disabled>Complete round &amp; rotate</button>';
      html += '</div>';
    }
    html += '</div>';

    byId("app").innerHTML = html;
    wireLive(round, week);
  }

  function hasAnyScore(round){
    var m = mergedCourts(round);
    return Object.keys(m).some(function(c){
      return m[c].scoreA!=null || m[c].scoreB!=null;
    });
  }

  function allScoresValid(round){
    return missingCourts(round).length===0;
  }

  function missingCourts(round){
    var m = mergedCourts(round);
    var n = courtCount(round);
    var missing = [];
    for(var c=1;c<=n;c++){
      var court = m[c];
      if(court.scoreA==null || court.scoreB==null) missing.push(c+" (needs both scores)");
      else if(court.scoreA===court.scoreB) missing.push(c+" (scores can't tie)");
    }
    return missing;
  }

  function refreshRoundStatus(round){
    var el = byId("roundStatus");
    if(!el) return;
    var missing = missingCourts(round);
    var n = courtCount(round);
    el.textContent = missing.length
      ? "Still needed before you can rotate — Court " + missing.join(", Court ")
      : "All "+n+" court"+(n===1?'':'s')+" "+(n===1?'is':'are')+" in — ready to rotate.";
    el.style.color = missing.length ? "var(--bench)" : "var(--win)";
  }

  function wireLive(round, week){
    document.querySelectorAll(".score-input").forEach(function(inp){
      var handler = function(){
        var c = this.dataset.court, side = this.dataset.side;
        var field = side==="teamA" ? "scoreA" : "scoreB";
        var v = this.value==="" ? null : parseInt(this.value,10);
        App.draft[c] = App.draft[c] || {};
        App.draft[c][field] = (v==null || isNaN(v)) ? null : v;
        var completeBtn = byId("btnComplete");
        if(completeBtn) completeBtn.disabled = !allScoresValid(round);
        var saveBtn = byId("btnSaveCorrection");
        if(saveBtn) saveBtn.disabled = !allScoresValid(round);
        refreshRoundStatus(round);
        var removeCourtBtn = byId("btnRemoveCourt");
        if(removeCourtBtn){
          var rN = courtCount(round);
          var lastCourtNow = courtView(round, rN);
          var lastHasScore = lastCourtNow.scoreA!=null || lastCourtNow.scoreB!=null;
          removeCourtBtn.disabled = !(rN>1 && !lastHasScore);
          removeCourtBtn.title = lastHasScore ? 'Court '+rN+' already has a score this round' : 'Send Court '+rN+'\'s players to the bench';
        }
        var swapToggleBtn = byId("btnSwapToggle");
        if(swapToggleBtn){
          var stillNoScores = !hasAnyScore(round);
          swapToggleBtn.disabled = !stillNoScores;
          swapToggleBtn.title = stillNoScores ? 'Move someone who didn\'t show or had to leave' : 'Can\'t swap once scores are entered this round';
        }
        var editMatchupBtn = document.querySelector('[data-edit-matchup="'+c+'"]');
        if(editMatchupBtn){
          var thisCourtNow = courtView(round, c);
          var thisCourtScored = thisCourtNow.scoreA!=null || thisCourtNow.scoreB!=null;
          editMatchupBtn.style.display = thisCourtScored ? "none" : "";
        }
        // live highlight without full re-render to keep focus
        var card = document.querySelector('.court-card[data-court="'+c+'"]');
        var court = courtView(round, c);
        var wl = winnerLoser(court);
        card.querySelectorAll(".team-row").forEach(function(row, idx){
          var key = idx===0 ? "teamA" : "teamB";
          row.classList.toggle("won", !!(wl && wl.winner===court[key]));
          row.classList.toggle("lost", !!(wl && wl.loser===court[key]));
        });
      };
      inp.addEventListener("input", handler);
      inp.addEventListener("change", handler);
    });
    var saveBtn = byId("btnSaveCorrection");
    if(saveBtn){
      saveBtn.disabled = !allScoresValid(round);
      saveBtn.addEventListener("click", function(){
        saveBtn.disabled = true;
        var courts = mergedCourts(round);
        var savedRound = {
          index: round.index,
          courts: courts,
          benchSnapshot: round.benchSnapshot,
          benchQueueBefore: round.benchQueueBefore
        };
        var rounds = week.rounds.slice(0, week.rounds.length-1).concat([savedRound]);
        App.db.doc(weekDocPath(week.id)).update({ rounds: rounds }).then(function(){
          App.draft = {};
        }).catch(function(){ saveBtn.disabled = false; });
      });
    }
    var completeBtn = byId("btnComplete");
    if(completeBtn){
      completeBtn.disabled = !allScoresValid(round);
      refreshRoundStatus(round);
      completeBtn.addEventListener("click", function(){
        var courts = mergedCourts(round);
        var next = computeNextRound(courts, week.benchQueue||[], courtCount(round));
        // Persist THIS round's actual scores (they only ever lived in the
        // local draft until now) before appending the freshly-rotated one.
        var completedRound = {
          index: round.index,
          courts: courts,
          benchSnapshot: round.benchSnapshot,
          benchQueueBefore: round.benchQueueBefore
        };
        var newRound = {
          index: round.index+1,
          courts: next.courts,
          benchSnapshot: next.benchQueue,
          benchQueueBefore: week.benchQueue||[]
        };
        var rounds = week.rounds.slice(0, week.rounds.length-1).concat([completedRound, newRound]);
        App.db.doc(weekDocPath(week.id)).update({
          rounds: rounds,
          benchQueue: next.benchQueue
        }).then(function(){
          App.draft = {};
        });
      });
    }
    var reopenBtn = byId("btnReopen");
    if(reopenBtn){
      reopenBtn.addEventListener("click", function(){
        var rounds = week.rounds.slice(0, week.rounds.length-1);
        var prevBench = round.benchQueueBefore || [];
        App.draft = {};
        App.db.doc(weekDocPath(week.id)).update({
          rounds: rounds,
          benchQueue: prevBench
        });
      });
    }
    var finBtn = byId("btnFinalize");
    if(finBtn){
      finBtn.addEventListener("click", function(){
        App.confirmFinalize = true;
        render();
      });
    }
    var finNo = byId("btnFinalizeNo");
    if(finNo){
      finNo.addEventListener("click", function(){
        App.confirmFinalize = false;
        render();
      });
    }
    var finYes = byId("btnFinalizeYes");
    if(finYes){
      finYes.addEventListener("click", function(){
        finYes.disabled = true;
        // Persist any pending score edits for the current round as part of
        // the same write — finalizing must never silently drop unsaved
        // draft scores.
        var courts = mergedCourts(round);
        var savedRound = {
          index: round.index,
          courts: courts,
          benchSnapshot: round.benchSnapshot,
          benchQueueBefore: round.benchQueueBefore
        };
        var rounds = week.rounds.slice(0, week.rounds.length-1).concat([savedRound]);
        var finalN = courtCount(round);
        var seeding = [];
        for(var c=1;c<=finalN;c++){ seeding.push(courts[c].teamA[0],courts[c].teamA[1],courts[c].teamB[0],courts[c].teamB[1]); }
        seeding = seeding.concat(week.benchQueue||[]);
        // Next week's courts are seeded live off the season Standings
        // (see standingsOrder()), not off this week's ladder finish — so
        // finalSeeding here is kept only as a historical record of how the
        // week ended, and no longer feeds rankOrder.
        App.db.doc(weekDocPath(week.id)).update({finalized:true, finalSeeding:seeding, finalCourtCount:finalN, rounds:rounds}).then(function(){
          App.confirmFinalize = false;
          App.draft = {};
          App.recapWeekId = week.id;
          App.recapReturnView = "roster";
          App.view = "recap";
          render();
        }).catch(function(){
          finYes.disabled = false;
        });
      });
    }
    var unlockBtn = byId("btnUnlock");
    if(unlockBtn){
      unlockBtn.addEventListener("click", function(){
        App.confirmUnlock = true;
        render();
      });
    }
    var unlockNo = byId("btnUnlockNo");
    if(unlockNo){
      unlockNo.addEventListener("click", function(){
        App.confirmUnlock = false;
        render();
      });
    }
    var unlockYes = byId("btnUnlockYes");
    if(unlockYes){
      unlockYes.addEventListener("click", function(){
        unlockYes.disabled = true;
        App.db.doc(weekDocPath(week.id)).update({finalized:false}).then(function(){
          App.confirmUnlock = false;
        }).catch(function(){ unlockYes.disabled = false; });
      });
    }
    var removeBtn = byId("btnRemoveCourt");
    if(removeBtn){
      removeBtn.addEventListener("click", function(){
        App.confirmCourtAction = "remove";
        render();
      });
    }
    var addCourtBtn = byId("btnAddCourt");
    if(addCourtBtn){
      addCourtBtn.addEventListener("click", function(){
        App.confirmCourtAction = "add";
        render();
      });
    }
    var courtNo = byId("btnCourtNo");
    if(courtNo){
      courtNo.addEventListener("click", function(){
        App.confirmCourtAction = null;
        render();
      });
    }
    var courtYes = byId("btnCourtYes");
    if(courtYes){
      courtYes.addEventListener("click", function(){
        courtYes.disabled = true;
        var n = courtCount(round);
        var newCourts = {};
        for(var i=1;i<=n;i++){ newCourts[i] = round.courts[i]; }
        var newBench = (week.benchQueue||[]).slice();
        if(App.confirmCourtAction==="remove" && n>1){
          var leaving = round.courts[n].teamA.concat(round.courts[n].teamB);
          delete newCourts[n];
          newBench = leaving.concat(newBench);
        } else if(App.confirmCourtAction==="add" && n<6 && newBench.length>=4){
          var arriving = newBench.slice(0,4);
          newBench = newBench.slice(4);
          var pr = pairUp(arriving, {});
          newCourts[n+1] = {teamA:pr.teamA, teamB:pr.teamB, scoreA:null, scoreB:null};
        } else {
          App.confirmCourtAction = null;
          render();
          return;
        }
        var updatedRound = {
          index: round.index,
          courts: newCourts,
          benchSnapshot: round.benchSnapshot,
          benchQueueBefore: round.benchQueueBefore
        };
        var rounds = week.rounds.slice(0, week.rounds.length-1).concat([updatedRound]);
        App.db.doc(weekDocPath(week.id)).update({ rounds: rounds, benchQueue: newBench }).then(function(){
          App.confirmCourtAction = null;
          App.draft = {};
        }).catch(function(){ courtYes.disabled = false; });
      });
    }
    document.querySelectorAll("[data-edit-matchup]").forEach(function(el){
      el.addEventListener("click", function(){
        App.editMatchupCourt = parseInt(this.dataset.editMatchup,10);
        render();
      });
    });
    document.querySelectorAll("[data-cancel-matchup]").forEach(function(el){
      el.addEventListener("click", function(){
        App.editMatchupCourt = null;
        render();
      });
    });
    document.querySelectorAll("[data-pick-split]").forEach(function(el){
      el.addEventListener("click", function(){
        var c = this.dataset.courtEdit;
        var idx = parseInt(this.dataset.pickSplit,10);
        var court = round.courts[c];
        if(court.scoreA!=null || court.scoreB!=null){
          App.editMatchupCourt = null;
          render();
          return;
        }
        var pool = court.teamA.concat(court.teamB);
        var splits = [
          [[pool[0],pool[1]],[pool[2],pool[3]]],
          [[pool[0],pool[2]],[pool[1],pool[3]]],
          [[pool[0],pool[3]],[pool[1],pool[2]]]
        ];
        var chosen = splits[idx];
        var n = courtCount(round);
        var newCourts = {};
        for(var i=1;i<=n;i++){ newCourts[i] = round.courts[i]; }
        newCourts[c] = {teamA:chosen[0], teamB:chosen[1], scoreA:null, scoreB:null};
        var updatedRound = { index: round.index, courts: newCourts, benchSnapshot: round.benchSnapshot, benchQueueBefore: round.benchQueueBefore };
        var rounds = week.rounds.slice(0, week.rounds.length-1).concat([updatedRound]);
        App.editMatchupCourt = null;
        App.db.doc(weekDocPath(week.id)).update({ rounds: rounds });
      });
    });
    var swapToggle = byId("btnSwapToggle");
    if(swapToggle){
      swapToggle.addEventListener("click", function(){
        App.swapPanelOpen = !App.swapPanelOpen;
        render();
      });
    }
    var swapCancel = byId("btnSwapCancel");
    if(swapCancel){
      swapCancel.addEventListener("click", function(){
        App.swapPanelOpen = false;
        render();
      });
    }
    var swapGo = byId("btnSwapGo");
    if(swapGo){
      swapGo.addEventListener("click", function(){
        var a = byId("swapSelectA").value, b = byId("swapSelectB").value;
        var warnEl = byId("swapWarn");
        if(hasAnyScore(round)){
          if(warnEl) warnEl.textContent = "A score's already been entered this round — can't swap anymore.";
          App.swapPanelOpen = false;
          render();
          return;
        }
        if(a===b){
          if(warnEl) warnEl.textContent = "Pick two different people to swap.";
          return;
        }
        var n = courtCount(round);
        var newCourts = {};
        for(var i=1;i<=n;i++){
          newCourts[i] = { teamA: round.courts[i].teamA.slice(), teamB: round.courts[i].teamB.slice(), scoreA: round.courts[i].scoreA, scoreB: round.courts[i].scoreB };
        }
        var newBench = (week.benchQueue||[]).slice();
        function locate(id){
          for(var c=1;c<=n;c++){
            var ai = newCourts[c].teamA.indexOf(id);
            if(ai>-1) return {court:c, team:"teamA", idx:ai};
            var bi = newCourts[c].teamB.indexOf(id);
            if(bi>-1) return {court:c, team:"teamB", idx:bi};
          }
          var be = newBench.indexOf(id);
          if(be>-1) return {bench:be};
          return null;
        }
        var locA = locate(a), locB = locate(b);
        if(!locA || !locB){
          if(warnEl) warnEl.textContent = "Couldn't find one of those players in this round.";
          return;
        }
        function place(loc, id){
          if(loc.bench!=null) newBench[loc.bench] = id;
          else newCourts[loc.court][loc.team][loc.idx] = id;
        }
        place(locA, b);
        place(locB, a);
        var updatedRound = { index: round.index, courts: newCourts, benchSnapshot: round.benchSnapshot, benchQueueBefore: round.benchQueueBefore };
        var rounds = week.rounds.slice(0, week.rounds.length-1).concat([updatedRound]);
        App.swapPanelOpen = false;
        App.db.doc(weekDocPath(week.id)).update({ rounds: rounds, benchQueue: newBench });
      });
    }
  }

  function renderRecap(week){

    var html = '<div class="stack">';

    html += '<div class="panel panel-pad" style="text-align:center;background:var(--court);border-color:var(--court);">';
    html += '<div style="font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.7);margin-bottom:4px;">Session Recap</div>';
    html += '<div class="display" style="font-size:32px;color:#fff;">'+week.label+'</div>';
    html += '<div style="font-size:13px;color:rgba(255,255,255,.85);margin-top:6px;">'+recap.totalRounds+' round'+(recap.totalRounds===1?'':'s')+' &middot; '+recap.totalGames+' games played &middot; '+recap.totalPoints+' points on the board</div>';
    html += '</div>';

    if(recap.topCourtBoth.length){
      html += '<div class="panel panel-pad">';
      html += '<div class="section-title">&#128081; Ruling Court 1</div>';
      if(recap.topCourtWinner){
        html += '<div style="font-size:16px;font-weight:700;margin-top:4px;">'+recap.topCourtWinner.map(nameOf).join(' & ')+'</div>';
        html += '<div style="font-size:12.5px;color:var(--ink-soft);margin-top:2px;">Won Court 1\'s final game of the night &mdash; top of the ladder.</div>';
      } else {
        html += '<div style="font-size:16px;font-weight:700;margin-top:4px;">'+recap.topCourtBoth.map(nameOf).join(' & ')+'</div>';
        html += '<div style="font-size:12.5px;color:var(--ink-soft);margin-top:2px;">Battling it out on Court 1 as the night wrapped up.</div>';
      }
      html += '</div>';
    }

    var stories = [];
    if(recap.biggestRiser){
      var rise = recap.biggestRiser;
      stories.push({icon:'&#128640;', title:'Biggest climb', text: nameOf(rise.id)+' started the day on Court '+rise.start+' and finished on Court '+rise.end+' &mdash; a '+rise.delta+'-court climb.'});
    }
    if(recap.biggestFaller){
      var fall = recap.biggestFaller;
      stories.push({icon:'&#128202;', title:'Long way down', text: nameOf(fall.id)+' opened on Court '+fall.start+' and slid to Court '+fall.end+' by the last round.'});
    }
    if(recap.closest){
      var c = recap.closest;
      stories.push({icon:'&#128561;', title:'Nail-biter of the night', text: c.winner.map(nameOf).join(' & ')+' edged out '+c.loser.map(nameOf).join(' & ')+' '+Math.max(c.scoreA,c.scoreB)+'-'+Math.min(c.scoreA,c.scoreB)+' on Court '+c.court+' &mdash; the closest game of the day.'});
    }
    if(recap.blowout && recap.blowout!==recap.closest){
      var b = recap.blowout;
      stories.push({icon:'&#128165;', title:'Blowout of the night', text: b.winner.map(nameOf).join(' & ')+' ran over '+b.loser.map(nameOf).join(' & ')+' '+Math.max(b.scoreA,b.scoreB)+'-'+Math.min(b.scoreA,b.scoreB)+' on Court '+b.court+'.'});
    }
    if(recap.bestPair){
      var p = recap.bestPair;
      stories.push({icon:'&#129309;', title:'Dream team', text: nameOf(p.a)+' & '+nameOf(p.b)+' went '+p.wins+'-'+(p.games-p.wins)+' together &mdash; the best partnership on the courts today.'});
    }
    if(recap.perfect.length){
      stories.push({icon:'&#128293;', title:'Undefeated', text: recap.perfect.map(nameOf).join(', ')+' didn\'t drop a single game all day.'});
    }

    if(stories.length){
      html += '<div class="panel"><div class="section-title" style="padding:14px 16px 0;">The Storylines</div>';
      stories.forEach(function(s, i){
        html += '<div style="display:flex;gap:12px;padding:12px 16px;'+(i<stories.length-1?'border-bottom:1px solid var(--line);':'')+'">';
        html += '<div style="font-size:22px;line-height:1;">'+s.icon+'</div>';
        html += '<div><div style="font-weight:700;font-size:12px;color:var(--court);text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px;">'+s.title+'</div><div style="font-size:14px;line-height:1.45;">'+s.text+'</div></div>';
        html += '</div>';
      });

    html += '<div class="actions"><button class="btn accent" id="btnRecapContinue">'+continueLabel+'</button></div>';
    html += '</div>';
    byId("app").innerHTML = html;

    var contBtn = byId("btnRecapContinue");
    if(contBtn) contBtn.addEventListener("click", function(){
      App.view = App.recapReturnView || "roster";
      App.recapWeekId = null;
      render();
    });
  }

  function renderStandings(){
    var stats = computeStats();
    var col = App.sortCol, dir = App.sortDir;
    function recordThenPoints(a,b){
      for(var i=0;i<RECORD_TIEBREAK.length;i++){
        var k = RECORD_TIEBREAK[i];
        if(a[k]!==b[k]) return b[k]-a[k];
      }
      return a.name.localeCompare(b.name);
    }
    stats.sort(function(a,b){
      var av=a[col], bv=b[col];
      var primary = (typeof av==="string") ? (dir==="asc"?av.localeCompare(bv):bv.localeCompare(av)) : (dir==="asc"?av-bv:bv-av);
      if(primary!==0) return primary;
      return recordThenPoints(a,b);
    });
    var globalBest = bestPairingsGlobal(stats);

    var html = '<div class="stack">';
    html += '<div class="banner"><span>&#127942;</span><span><b>Standings rank by Court Points first</b> &mdash; a win is worth more the higher the court it\'s won on (Court 1 = 3, Court 2 = 2.5, Court 3 = 2, Court 4 = 1.5, Court 5 = 1, Court 6 = 0.5). Ties break by W/L record, then point differential.</span></div>';
    html += '<div class="panel panel-pad"><div class="section-title">Top pairings this season</div>';
    if(globalBest.length===0){
      html += '<div class="empty">Need a few more games together before pairings settle out.</div>';
    } else {
      html += '<div class="stat-hero">';
      globalBest.forEach(function(p){
        html += '<div class="cell"><div class="v">'+pct(p.winPct)+'</div><div class="l">'+nameOf(p.a)+' &amp; '+nameOf(p.b)+' &middot; '+p.games+'g</div></div>';
      });
      html += '</div>';
    }
    html += '</div>';

    html += '<div class="panel"><div class="table-wrap"><table><thead><tr>';
    var cols = [
      ["name","Player"],["courtPoints","Court Pts"],["sessions","Sessions"],["gw","W"],["gl","L"],["diff","Diff"],
      ["winPct","Win%"],["pf","Pts For"],["pa","Pts Ag"],["pdiff","Pt Diff"],["pwinPct","Pt%"]
    ];
    cols.forEach(function(c){
      html += '<th data-col="'+c[0]+'" class="'+(col===c[0]?'sorted':'')+'">'+c[1]+(col===c[0]?(dir==="asc"?" ↑":" ↓"):'')+'</th>';
    });
    html += '<th>Best partner</th></tr></thead><tbody>';
    stats.forEach(function(p){
      html += '<tr data-player="'+p.id+'">';
      html += '<td>'+p.name+'</td>';
      html += '<td class="num mono" style="font-weight:700;color:var(--court);">'+p.courtPoints.toFixed(1)+'</td>';
      html += '<td class="num">'+p.sessions+'</td>';
      html += '<td class="num">'+p.gw+'</td>';
      html += '<td class="num">'+p.gl+'</td>';
      html += '<td class="num">'+(p.diff>0?'+':'')+p.diff+'</td>';
      html += '<td class="num">'+pct(p.winPct)+'</td>';
      html += '<td class="num">'+p.pf+'</td>';
      html += '<td class="num">'+p.pa+'</td>';
      html += '<td class="num">'+(p.pdiff>0?'+':'')+p.pdiff+'</td>';
      html += '<td class="num">'+pct(p.pwinPct)+'</td>';
      html += '<td>'+(p.bestPartner? p.bestPartner.name+' <span class="mono" style="color:var(--ink-faint);font-size:11.5px">'+pct(p.bestPartner.winPct)+'</span>' : '&mdash;')+'</td>';
      html += '</tr>';
    });
    html += '</tbody></table></div></div>';

    if(App.detailPlayer){
      var p = stats.find(function(s){ return s.id===App.detailPlayer; });
      if(p){
        html += '<div class="panel panel-pad"><button class="btn ghost small detail-close" id="closeDetail">Close</button>';
        html += '<div class="section-title">Head-to-head &middot; '+p.name+'</div>';
        var opps = Object.keys(p.opponents).map(function(oid){
          var o = p.opponents[oid]; var gp=o.w+o.l;
          return {id:oid, name:nameOf(oid), w:o.w, l:o.l, gp:gp, pf:o.pf, pa:o.pa};
        }).sort(function(a,b){ return b.gp-a.gp; });
        if(opps.length===0){ html += '<div class="empty">No games logged yet.</div>'; }
        else {
          html += '<div class="table-wrap"><table><thead><tr><th>Opponent</th><th class="num">W</th><th class="num">L</th><th class="num">Pts</th></tr></thead><tbody>';
          opps.forEach(function(o){
            html += '<tr><td>'+o.name+'</td><td class="num">'+o.w+'</td><td class="num">'+o.l+'</td><td class="num">'+o.pf+'-'+o.pa+'</td></tr>';
          });
          html += '</tbody></table></div>';

  function renderRoster(){

    var sorted = entries.slice().sort(function(a,b){ return a.ts-b.ts; });
    var confirmedIds = sorted.slice(0,24).map(function(e){ return e.id; });
    var waitlistIds = sorted.slice(24).map(function(e){ return e.id; });
    var rankOrder = standingsOrder();
